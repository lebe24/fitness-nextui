<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="Iron Index — a training archive. Browse 1300+ exercises by target muscle and pull technique videos, built on ExerciseDB."
    />
    <meta property="og:title" content="Iron Index — Health &amp; Fitness Archive" />
    <meta
      property="og:description"
      content="Pick a target. Get the movement. 1300+ exercises indexed by body part."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Chivo+Mono:wght@400;500;700&family=Chivo:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Iron Index — Health &amp; Fitness Archive</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Vercel Web Analytics.

      Only Vercel deployments serve /_vercel/insights/script.js, so the guard
      below skips the request on localhost and on the Cloudflare Pages and
      GitHub Pages mirrors, where it would 404 on every page view. It fails
      open: any host not on that list still gets the script, so pointing a
      custom domain at Vercel needs no change here.

      Counting only starts once Web Analytics is enabled for the project in the
      Vercel dashboard.
    -->
    <script>
      (function () {
        var skip = /(^|\.)pages\.dev$|(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$|^\[::1\]$/;
        if (skip.test(location.hostname)) return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = '/_vercel/insights/script.js';
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
